name: Defender for Cloud evidence collection

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: read

concurrency:
  group: defender-cloud-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    environment: defender-read
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      DEFENDER_OUTPUT: ${{ runner.temp }}/defender-${{ github.run_id }}-${{ github.run_attempt }}
      AZURE_CORE_OUTPUT: none
      AZURE_SUBSCRIPTION_IDS: ${{ vars.AZURE_SUBSCRIPTION_IDS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test collector
        run: python3 -m unittest discover -s tests -v
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Collect current assessment evidence
        run: python3 scripts/read_azure.py --out "$DEFENDER_OUTPUT"
      - name: Preserve evidence and collection status
        if: always() && github.event.repository.private == true
        uses: actions/upload-artifact@v4
        with:
          name: defender-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DEFENDER_OUTPUT }}/
          if-no-files-found: error
          retention-days: 7
      - name: Remove local evidence
        if: always()
        run: |
          python3 - <<'PYTHON'
          import os
          import shutil
          from pathlib import Path
          path = Path(os.environ['DEFENDER_OUTPUT']).resolve()
          root = Path(os.environ['RUNNER_TEMP']).resolve()
          if path.parent != root or not path.name.startswith('defender-'):
              raise RuntimeError('Unexpected evidence directory')
          if path.exists():
              shutil.rmtree(path)
          PYTHON
