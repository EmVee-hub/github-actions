name: Container security PoC showcase

# Manual, synthetic-only demonstrations; zero cloud credentials or live collection.
# The full regression suite runs automatically in ci.yml.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Choose the PoC demonstration
        type: choice
        required: true
        default: all
        options: [all, runtime, inspector, defender]

permissions:
  contents: read

jobs:
  guide:
    name: Start here — how to read these results
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Explain the demonstration before assessment jobs
        run: |
          echo '::notice title=How to read this run::Synthetic data only. Raw provider fixtures flow through normalization, explicit fixture identity mapping, Pod matching, VEX and policy. Read the guide for remaining live integration gaps.'
          cat docs/showcase-guide.md >> "$GITHUB_STEP_SUMMARY"

  showcase:
    name: Connected AWS and Azure assessment (synthetic)
    needs: [guide]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Normalize providers, map fixture identities, correlate Pods and evaluate policy
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          python3 scripts/cloud_showcase.py --scenario "$SCENARIO" --output "$RUNNER_TEMP/cloud-showcase"
          cat "$RUNNER_TEMP/cloud-showcase/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify connected cloud scenarios
        run: python3 -m unittest discover -s tests -p 'test_cloud_showcase.py' -v
      - name: Upload source, normalization, mapping and decision evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connected-cloud-showcase
          path: ${{ runner.temp }}/cloud-showcase/
          if-no-files-found: error
          retention-days: 7
