name: AWS CI

on:
  push:
    branches: [main, 'feature/**', 'feat/**']
    paths:
      - 'scripts/collect_inspector.py'
      - 'iam/aws-inspector/**'
      - 'tests/test_inspector.py'
      - 'tests/fixtures/inspector-*.json'
      - 'docs/aws-inspector.md'
      - '.github/workflows/aws-inspector.yml'
      - '.github/workflows/ci-aws.yml'
  pull_request:
    paths:
      - 'scripts/collect_inspector.py'
      - 'iam/aws-inspector/**'
      - 'tests/test_inspector.py'
      - 'tests/fixtures/inspector-*.json'
      - 'docs/aws-inspector.md'
      - '.github/workflows/aws-inspector.yml'
      - '.github/workflows/ci-aws.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: AWS CI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run aws tests without cloud credentials
        run: python3 -m unittest discover -s tests -p 'test_inspector.py' -v
