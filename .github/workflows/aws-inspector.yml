name: AWS Inspector collection

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Offline debug or live AWS collection'
        type: choice
        options: [debug, aws]
        default: debug
      findings_json:
        description: 'Debug: paste Inspector JSON with a findings array; leave empty for sample data'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: aws-inspector-${{ github.ref }}
  cancel-in-progress: false

jobs:
  debug:
    if: ${{ inputs.mode == 'debug' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Normalize supplied data without AWS
        env:
          FINDINGS_JSON: ${{ inputs.findings_json }}
          REPORT_DIR: ${{ runner.temp }}/inspector-debug-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [[ -n "$FINDINGS_JSON" ]]; then
            printf '%s' "$FINDINGS_JSON" | python3 scripts/collect_inspector.py --input-file - --output "$REPORT_DIR"
          else
            python3 scripts/collect_inspector.py --input-file tests/fixtures/inspector-debug.json --output "$REPORT_DIR"
          fi
          echo 'Offline Inspector debug completed. No AWS calls. Policy evaluation remains pending.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve debug evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: inspector-debug-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inspector-debug-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14
  collect:
    if: ${{ inputs.mode == 'aws' }}
    # Set AWS_INSPECTOR_REGIONS to a JSON array, e.g. ["eu-north-1"].
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJSON(vars.AWS_INSPECTOR_REGIONS) }}
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    environment: aws-security-read
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check runner prerequisites
        run: |
          set -euo pipefail
          python3 --version
          aws --version
          python3 -m unittest discover -s tests -v
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_INSPECTOR_ROLE_ARN }}
          aws-region: ${{ matrix.region }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: inspector-${{ github.run_id }}
          unset-current-credentials: true
          mask-aws-account-id: true
      - name: Collect and normalize
        env:
          INSPECTOR_REGION: ${{ matrix.region }}
          REPORT_DIR: ${{ runner.temp }}/inspector-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.region }}
        run: |
          set -euo pipefail
          python3 scripts/collect_inspector.py --region "$INSPECTOR_REGION" --output "$REPORT_DIR"
          echo 'Inspector collection completed. VEX and decision policy are not evaluated by this job.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve collection evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: inspector-${{ matrix.region }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inspector-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.region }}/
          if-no-files-found: warn
          retention-days: 14
