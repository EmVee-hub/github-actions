name: Runtime vulnerability pilot (private execution repository ONLY)

# COPY this template into a PRIVATE execution repository and review permissions.
# DO NOT execute cloud collection from a public repo: real findings and workload
# metadata are sensitive. Only manual invocation is supported initially.
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [ecs, eks, aks]
        required: true
      cluster:
        type: string
        required: true
      region:
        type: string
        description: AWS Region (ECS/EKS)
        required: false
      subscription_id:
        type: string
        description: Azure subscription UUID (AKS)
        required: false
      resource_group:
        type: string
        description: AKS resource group (AKS)
        required: false

permissions:
  contents: read

concurrency:
  group: runtime-pilot-${{ inputs.platform }}-${{ inputs.cluster }}
  cancel-in-progress: false

jobs:
  pilot:
    if: ${{ github.event.repository.private == true }}
    # Dedicated, isolated, single-use runner is strongly recommended.
    runs-on: [self-hosted, linux]
    environment: runtime-security-read
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write

    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ inputs.region }}
      INPUT_PLATFORM: ${{ inputs.platform }}
      INPUT_CLUSTER: ${{ inputs.cluster }}
      AZURE_SUBSCRIPTION_ID: ${{ inputs.subscription_id }}
      AZURE_RESOURCE_GROUP: ${{ inputs.resource_group }}

    steps:
      - name: Check out private execution repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Check out reviewed security toolkit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: EmVee-hub/github-actions
          ref: ed6191cb4a458546774fbe114a34bbd4869098a6
          path: security-toolkit
          persist-credentials: false

      - name: Check out approved project VEX
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: EmVee-hub/service-blueprint
          ref: 282ef2b0a2debc9fe946cb4ea0ffbd0025f79ab7
          path: approved-project
          persist-credentials: false

      - name: Validate inputs and prepare isolated evidence directory
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$INPUT_PLATFORM" != aks && -z "$AWS_REGION" ]]; then
            echo "Missing required AWS Region" >&2; exit 2
          fi
          if [[ "$INPUT_PLATFORM" == aks && ( -z "$AZURE_SUBSCRIPTION_ID" || -z "$AZURE_RESOURCE_GROUP" ) ]]; then
            echo "AKS subscription and resource group are required" >&2; exit 2
          fi
          mkdir -m 0700 "$RUNNER_TEMP/runtime-pilot"
          echo "OUTPUT=$RUNNER_TEMP/runtime-pilot" >> "$GITHUB_ENV"
          echo "KUBECONFIG=$RUNNER_TEMP/runtime-pilot/kubeconfig" >> "$GITHUB_ENV"

      - name: Authenticate AWS with read-only OIDC
        if: ${{ inputs.platform == 'ecs' || inputs.platform == 'eks' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_RUNTIME_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: runtime-pilot-${{ github.run_id }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Authenticate Azure with read-only OIDC
        if: ${{ inputs.platform == 'aks' }}
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.subscription_id }}

      - name: Collect AWS Inspector evidence and AWS runtime inventory
        if: ${{ inputs.platform == 'ecs' || inputs.platform == 'eks' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 security-toolkit/scripts/collect_inspector.py \
            --region "$AWS_REGION" --output "$OUTPUT/inspector"
          if [[ "$INPUT_PLATFORM" == ecs ]]; then
            python3 security-toolkit/scripts/runtime_workloads.py --platform ECS \
              --cluster "$INPUT_CLUSTER" --account-id "$AWS_ACCOUNT_ID" \
              --region "$AWS_REGION" --output "$OUTPUT/workloads.json"
          else
            aws eks update-kubeconfig --region "$AWS_REGION" --name "$INPUT_CLUSTER" \
              --kubeconfig "$KUBECONFIG"
            python3 security-toolkit/scripts/runtime_workloads.py --platform EKS \
              --cluster "$INPUT_CLUSTER" --account-id "$AWS_ACCOUNT_ID" \
              --region "$AWS_REGION" --output "$OUTPUT/workloads.json"
          fi

      - name: Collect Defender evidence and AKS runtime inventory
        if: ${{ inputs.platform == 'aks' }}
        shell: bash
        env:
          AZURE_SUBSCRIPTION_IDS: '["${{ inputs.subscription_id }}"]'
        run: |
          set -euo pipefail
          az aks get-credentials --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INPUT_CLUSTER" --file "$KUBECONFIG" --overwrite-existing
          python3 security-toolkit/scripts/read_azure.py --out "$OUTPUT/defender"
          python3 security-toolkit/scripts/runtime_workloads.py --platform AKS \
            --cluster "$INPUT_CLUSTER" --subscription-id "$AZURE_SUBSCRIPTION_ID" \
            --output "$OUTPUT/workloads.json"

      - name: Select correlated CVEs, fetch authoritative intelligence, evaluate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$INPUT_PLATFORM" == aks ]]; then
            sources=(--defender "$OUTPUT/defender/observations.json")
          else
            sources=(--inspector "$OUTPUT/inspector/normalized-findings.json")
          fi
          python3 security-toolkit/scripts/runtime_assess.py \
            "${sources[@]}" --inventory "$OUTPUT/workloads.json" \
            --cves-only "$OUTPUT/cves.json"
          python3 security-toolkit/scripts/fetch_runtime_intel.py \
            --cves "$OUTPUT/cves.json" --output "$OUTPUT/intel.json"
          # Only projects explicitly approved here have a VEX document loaded.
          # Other project labels remain REVIEW_REQUIRED.
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          output = Path(os.environ["OUTPUT"])
          vex_path = Path(os.environ["GITHUB_WORKSPACE"]) / "approved-project/vex/openvex.json"
          (output / "vex-map.json").write_text(json.dumps({"service-blueprint": str(vex_path)}) + "\n")
          PY
          python3 security-toolkit/scripts/runtime_assess.py \
            "${sources[@]}" --inventory "$OUTPUT/workloads.json" \
            --intel "$OUTPUT/intel.json" --vex-map "$OUTPUT/vex-map.json" \
            --output "$OUTPUT/assessment.json" --markdown "$OUTPUT/report.md"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          doc=json.loads((Path(os.environ["OUTPUT"])/"assessment.json").read_text())
          # Summary is deliberately count-only. No account or CVE details in logs.
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("# Runtime pilot (shadow-only)\n\n")
              out.write("Workloads observed: " + str(doc["runtime_workloads_observed"]) + "\n\n")
              out.write("Decision statuses: " + str(doc["counts"]) + "\n\n")
              out.write("Coverage and production enforcement NOT VERIFIED.\n")
          PY

      - name: Preserve private evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-runtime-pilot-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-pilot/
          if-no-files-found: warn
          retention-days: 7

      - name: Remove runtime evidence and Kubernetes credentials from runner
        if: always()
        shell: bash
        run: |
          if [[ -n "${{ runner.temp }}" && -d "${{ runner.temp }}/runtime-pilot" ]]; then
            rm -rf -- "${{ runner.temp }}/runtime-pilot"
          fi
