name: Grype + VEX + BOD/EPSS policy scan
description: >-
  Evaluates a locally built image using Grype JSON, project OpenVEX,
  CISA BOD 26-04 semantics, and a versioned local EPSS amplifier.
inputs:
  image:
    description: Exact locally built image reference to scan
    required: true
  vex-path:
    description: Path to project-specific OpenVEX JSON file
    required: true
  exposure:
    description: 'public, internal, or unknown (unknown defaults to public)'
    required: false
    default: unknown
  mode:
    description: 'shadow (report only) or enforce (fail on BLOCK / REVIEW_REQUIRED)'
    required: false
    default: shadow
  grype-binary:
    description: Path to preinstalled Grype CLI; defaults to grype on PATH
    required: false
    default: grype
  report-directory:
    description: Output folder relative to the checkout, or absolute path
    required: false
    default: security-reports
outputs:
  admission:
    description: ALLOW, BLOCK or REVIEW_REQUIRED
    value: ${{ steps.scan.outputs.admission }}
  report-json:
    description: Path to machine-readable decision report
    value: ${{ steps.scan.outputs.report_json }}
  report-markdown:
    description: Path to Markdown decision report
    value: ${{ steps.scan.outputs.report_markdown }}
runs:
  using: composite
  steps:
    - id: scan
      shell: bash
      env:
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_VEX_PATH: ${{ inputs.vex-path }}
        INPUT_EXPOSURE: ${{ inputs.exposure }}
        INPUT_MODE: ${{ inputs.mode }}
        GRYPE_BIN: ${{ inputs.grype-binary }}
        REPORT_DIR: ${{ inputs.report-directory }}
      run: bash "$GITHUB_ACTION_PATH/run.sh"
